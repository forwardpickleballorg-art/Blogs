<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-mark" src="{{ '/assets/images/logo.svg' | relative_url }}" alt="Dive Forward Pickleball logo">
      <span class="brand-name">Dive Forward Pickleball</span>
    </a>
    <nav class="site-nav">
      {% for item in site.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
