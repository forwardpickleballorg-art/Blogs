theme: null

title: Forward Pickleball Coaching
description: >-
  Tips, drills, and stories from our pickleball coaching team — helping
  players of every level move better, think smarter, and win more points.
baseurl: ""
url: ""

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

navigation:
  - title: Home
    url: /
  - title: Blog
    url: /blog/
  - title: Coaching
    url: /coaching/
  - title: About
    url: /about/
  - title: Contact
    url: /contact/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
